# Base de datos PostgreSQL para desarrollo: `docker compose up -d`
services:
  postgres:
    image: postgres:16-alpine
    container_name: turnify-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: turnify
      POSTGRES_PASSWORD: turnify
      POSTGRES_DB: turnify
    ports:
      - "5432:5432"
    volumes:
      - turnify_data:/var/lib/postgresql/data
volumes:
  turnify_data:
